<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sessions</title>
  <link rel="stylesheet" href="/ui/style.css">
</head>
<body>
  <nav id="nav"></nav>
  <main>
    <h1>Sessions</h1>
    <div id="message"></div>

    <form id="session-form">
      <h2 id="form-title">Add a session</h2>
      <div class="row">
        <div><label for="f-conference">Conference</label><select id="f-conference" required></select></div>
        <div><label for="f-chair">Chair (a reviewer)</label><select id="f-chair" required></select></div>
        <div><label for="f-title">Title</label><input type="text" id="f-title" required></div>
      </div>
      <div class="row">
        <div><label for="f-date">Date</label><input type="date" id="f-date" required></div>
        <div><label for="f-start">Start time</label><input type="time" id="f-start" required></div>
        <div><label for="f-end">End time (after start time)</label><input type="time" id="f-end" required></div>
        <div><label for="f-room">Room</label><input type="text" id="f-room" required></div>
      </div>
      <p>
        <button type="submit" id="save-button">Add session</button>
        <button type="button" class="light" id="cancel-button" onclick="resetForm()">Cancel edit</button>
      </p>
    </form>

    <div class="box">
      <h2>Schedule a paper</h2>
      <p class="hint">
        Only accepted papers can be scheduled, and the paper's track and the session must belong
        to the same conference.
      </p>
      <div class="row">
        <div><label for="s-paper">Paper</label><select id="s-paper"></select></div>
        <div><label for="s-session">Session</label><select id="s-session"></select></div>
      </div>
      <p>
        <button type="button" onclick="schedulePaper()">Set session</button>
        <span class="hint">Choose "(no session)" to remove the paper from its session.</span>
      </p>
    </div>

    <h2>All sessions</h2>
    <table id="sessions-table"></table>
  </main>

  <script src="/ui/common.js"></script>
  <script src="/ui/sessions.js"></script>
</body>
</html>
