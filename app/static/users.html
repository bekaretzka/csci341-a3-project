<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Users</title>
  <link rel="stylesheet" href="/ui/style.css">
</head>
<body>
  <nav id="nav"></nav>
  <main>
    <h1>Users</h1>
    <div id="message"></div>

    <form id="user-form">
      <h2 id="form-title">Add a user</h2>
      <div class="row">
        <div><label for="f-name">Name</label><input type="text" id="f-name" required></div>
        <div><label for="f-surname">Surname</label><input type="text" id="f-surname" required></div>
        <div><label for="f-email">Email</label><input type="email" id="f-email" required></div>
      </div>
      <div class="row">
        <div><label for="f-affiliation">Affiliation</label><input type="text" id="f-affiliation" required></div>
        <div><label for="f-country">Country</label><input type="text" id="f-country" required></div>
        <div><label for="f-phone">Phone</label><input type="tel" id="f-phone" maxlength="30" required></div>
      </div>

      <p class="hint">A user must be an author, a reviewer, or both.</p>
      <div class="row">
        <div class="box">
          <label><input type="checkbox" id="f-is-author">Author profile</label>
          <label for="f-orcid">ORCID (optional)</label><input type="text" id="f-orcid" placeholder="0000-0001-2345-6789">
          <label for="f-areas">Research areas (comma separated)</label><input type="text" id="f-areas" placeholder="Databases, Security">
        </div>
        <div class="box">
          <label><input type="checkbox" id="f-is-reviewer">Reviewer profile</label>
          <label for="f-years">Years of reviewing experience</label><input type="number" id="f-years">
          <label for="f-expertise">Expertise (comma separated)</label><input type="text" id="f-expertise" placeholder="Databases, Networks">
        </div>
      </div>

      <button type="submit" id="save-button">Add user</button>
      <button type="button" class="light" id="cancel-button" onclick="resetForm()">Cancel edit</button>
    </form>

    <h2>All users</h2>
    <table id="users-table"></table>
  </main>

  <script src="/ui/common.js"></script>
  <script src="/ui/users.js"></script>
</body>
</html>
